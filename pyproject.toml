[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-insights"
version = "0.1.0"
description = "Análisis de víctimas de accidentes de tránsito en Colombia"
requires-python = ">=3.13,<3.14"
dependencies = [
    "altair==6.3.0",
    "duckdb==2.0.0",
    "ijson==3.6.0",
    "pydeck==0.9.3",
    "shapely==2.2.0",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
